<style>

  *{box-sizing:border-box}
  body{margin:0;font-family:Lato,system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  header{background:var(--navy);color:#fff;padding:40px 20px 32px;text-align:center}
  .photo{width:116px;height:116px;border-radius:50%;object-fit:cover;border:4px solid #fff;display:block;margin:0 auto 18px}
  h1{font-weight:300;letter-spacing:.06em;font-size:30px;margin:0 0 8px;text-transform:uppercase}
  .tag{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#b9c3d0;margin:0}

  .primary{background:#0a66c2;color:#fff}
  .secondary{background:var(--card);color:var(--navy)}
  .btn svg{width:20px;height:20px;flex:none}
  .contact{max-width:520px;margin:18px auto 0;padding:0 16px;font-size:15px;color:var(--muted);text-align:center;line-height:1.8}
  .contact b{color:var(--ink);font-weight:700}
  .cv{max-width:900px;margin:28px auto 40px;padding:0 12px}
  .cv h2{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);text-align:center;margin:0 0 12px;font-weight:700}
  .cv img{width:100%;height:auto;display:block;border-radius:6px;box-shadow:0 4px 24px rgba(31,39,51,.15);background:#fff}
  footer{text-align:center;font-size:12px;color:var(--muted);padding:0 16px 32px}
